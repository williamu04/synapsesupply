[project]
name = "synapsesupply"
version = "0.1.0"
description = "Compliance-aware logistics exception & stock rebalancing agent (AWS-SAP AI Agentic Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "strands-agents>=1.61.1",
    "cedarpy>=4.12.2",
    "httpx>=0.27",
    "botocore[crt]>=1.43.116",
    "a2a-sdk[http-server]==0.3.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
aicore = [
    "strands-agents[litellm]>=1.61.1",
]
agentcore = [
    "bedrock-agentcore>=1.24.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
