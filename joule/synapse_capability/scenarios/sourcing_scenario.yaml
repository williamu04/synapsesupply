description: >-
  Handles wood-fibre sourcing and supply requests for pulp and paper mills: ordering or buying
  acacia wood chips or eucalyptus pulpwood logs for a mill such as Mill Riau-1 or Mill Jambi-2,
  sourcing from a named supplier, rebalancing or transferring stock between mills, and checking a
  supplier's EUDR deforestation or certificate compliance before purchasing.
